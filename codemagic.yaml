
workflows:
  iglesia-ios-device:
    name: Iglesia - Compilacion iPhone
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: v24.15.0
      xcode: latest

    scripts:
      - name: Instalar dependencias
        script: npm ci --ignore-scripts

      - name: Compilar Angular
        script: npx ng build --configuration production --base-href ./

      - name: Sincronizar Capacitor
        script: npx cap sync ios

      - name: Verificar proyecto Xcode
        script: xcodebuild -list -project ios/App/App.xcodeproj

      - name: Compilar para iPhone fisico sin firma
        script: |
          xcodebuild build \
            -project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            -scheme "App" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/build/ios/device" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Crear IPA para Sideloadly
        script: |
          APP_PATH="$CM_BUILD_DIR/build/ios/device/Build/Products/Release-iphoneos/App.app"

          rm -rf "$CM_BUILD_DIR/Payload"
          rm -f "$CM_BUILD_DIR/Iglesia.ipa"

          mkdir -p "$CM_BUILD_DIR/Payload"

          if [ ! -d "$APP_PATH" ]; then
            echo "ERROR: No se encontro App.app"
            exit 1
          fi

          ditto "$APP_PATH" "$CM_BUILD_DIR/Payload/App.app"

          ditto -c -k --sequesterRsrc --keepParent \
            "$CM_BUILD_DIR/Payload" \
            "$CM_BUILD_DIR/Iglesia.ipa"

          if [ ! -f "$CM_BUILD_DIR/Iglesia.ipa" ]; then
            echo "ERROR: No se genero Iglesia.ipa"
            exit 1
          fi

          unzip -l "$CM_BUILD_DIR/Iglesia.ipa"

          echo "IPA generado correctamente"

    artifacts:
      - Iglesia.ipa
      - build/ios/device/Build/Products/Release-iphoneos/*.app
      - /tmp/xcodebuild_logs/*.log
