
workflows:
  iglesia-ios-device:
    name: Iglesia - Compilacion iPhone
    max_build_duration: 120
    instance_type: mac_mini_m2

    environment:
      node: v24.15.0
      xcode: latest

    scripts:
      - name: Instalar dependencias
        script: npm ci --ignore-scripts

      - name: Compilar Angular
        script: npx ng build --configuration production --base-href ./

      - name: Sincronizar Capacitor
        script: npx cap sync ios

      - name: Verificar proyecto Xcode
        script: xcodebuild -list -project ios/App/App.xcodeproj

      - name: Compilar para iPhone fisico sin firma
        script: |
          xcodebuild build \
            -project "$CM_BUILD_DIR/ios/App/App.xcodeproj" \
            -scheme "App" \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -configuration Release \
            -derivedDataPath "$CM_BUILD_DIR/build/ios/device" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Comprimir aplicacion
        script: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$CM_BUILD_DIR/build/ios/device/Build/Products/Release-iphoneos/App.app" \
            "$CM_BUILD_DIR/App-iphone-unsigned.zip"

    artifacts:
      - build/ios/device/Build/Products/Release-iphoneos/*.app
      - App-iphone-unsigned.zip
      - /tmp/xcodebuild_logs/*.log
