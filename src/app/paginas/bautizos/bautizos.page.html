
<ion-header>
  <ion-toolbar color="light">
    <ion-buttons slot="start">
      <ion-button (click)="regresar()">
        <ion-icon name="arrow-back-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
    <ion-title>Bautizos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="bautizos-content">

  <div class="contenedor">

    <div class="encabezado">
      <div class="icono-principal">
        <ion-icon name="water-outline"></ion-icon>
      </div>

      <h1>Administración de Bautizos</h1>
      <p>Gestione los registros sacramentales de nuestra parroquia.</p>
    </div>

    <div class="opciones">

      <button class="tarjeta" (click)="abrirRegistro()">
        <div class="icono">
          <ion-icon name="document-text-outline"></ion-icon>
        </div>

        <div class="informacion">
          <h2>Registro de Bautizos</h2>
          <p>Registrar un nuevo bautismo y sus datos sacramentales.</p>
        </div>

        <ion-icon name="chevron-forward-outline"></ion-icon>
      </button>

      <button class="tarjeta" (click)="abrirListado()">
        <div class="icono">
          <ion-icon name="list-outline"></ion-icon>
        </div>

        <div class="informacion">
          <h2>Listado de Bautizos</h2>
          <p>Consultar, buscar y administrar los bautismos registrados.</p>
        </div>

        <ion-icon name="chevron-forward-outline"></ion-icon>
      </button>

    </div>

  </div>

</ion-content>
