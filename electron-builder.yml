
appId: com.iglesia.parroquial
productName: Iglesia

directories:
  output: release

asarUnpack:
  - node_modules/better-sqlite3/**/*

files:
  - electron/**/*
  - dist/**/*
  - package.json

win:
  target:
    - target: nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
